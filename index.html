<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andrea Carolina Ropero Lozano — Estadística · Automatización Industrial</title>
    <meta
      name="description"
      content="Andrea Carolina Ropero Lozano, estadística de la Universidad Nacional de Colombia: análisis cuantitativo, modelamiento estadístico y datos aplicados a la automatización industrial."
    />
    <!-- Open Graph — the SPA shell carries the full SEO surface statically. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Andrea Carolina Ropero Lozano — Estadística · Automatización Industrial" />
    <meta
      property="og:description"
      content="Estadística de la Universidad Nacional de Colombia: análisis cuantitativo, modelamiento estadístico y datos aplicados a la automatización industrial."
    />
    <meta property="og:url" content="https://andrearopero.github.io/portfolio-web/" />
    <meta property="og:locale" content="es_CO" />
    <!-- Structured data: only user-confirmed facts (name, role, affiliation,
         profiles). No dates, degrees, or contact data beyond the confirmed
         public links. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Andrea Carolina Ropero Lozano",
        "jobTitle": "Estadística",
        "affiliation": {
          "@type": "Organization",
          "name": "Universidad Nacional de Colombia"
        },
        "url": "https://andrearopero.github.io/portfolio-web/",
        "sameAs": [
          "https://github.com/andrearopero",
          "https://www.linkedin.com/in/andrea-ropero-lozano-a9a823207/"
        ]
      }
    </script>
    <!-- Favicon: inline SVG data URI (no extra asset request). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%237C3AED'/%3E%3Ctext%20x='32'%20y='43'%20font-family='sans-serif'%20font-size='30'%20font-weight='700'%20fill='white'%20text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"
    />
    <script>
      // No-FOUC theme bootstrap: resolves the theme pre-paint, before any
      // render. Stored choice wins; otherwise honor prefers-color-scheme.
      (() => {
        const root = document.documentElement;
        let stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch {
          // Storage unavailable (e.g. hardened privacy settings) — fall through.
        }
        const dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
