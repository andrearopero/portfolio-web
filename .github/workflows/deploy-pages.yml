# Deploy the Vite build to GitHub Pages.
#
# Artifact hygiene (portfolio-privacy spec): the uploaded artifact contains
# ONLY the Vite output in dist/ — root PDFs and run.sh never enter it,
# because the upload step points exclusively at dist/. The privacy and
# placeholder gates run before upload and hard-fail the workflow on any
# prohibited content.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc && vite build && scan-privacy (hard privacy gate).
      - name: Build
        run: npm run build

      # Placeholder gate (TODO-URL markers block publication).
      - name: Publish checks
        run: npm run check:publish

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # dist/ only — no repo root files, no PDFs, no run.sh.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
